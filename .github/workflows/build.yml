name: Build DroneCam ASI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSVC x86 Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Clone Plugin-SDK
        shell: cmd
        run: |
          git clone --depth 1 https://github.com/DK22Pac/plugin-sdk.git plugin-sdk

      - name: Configure CMake
        shell: cmd
        run: |
          cmake -B build -S . -A Win32 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: cmd
        run: |
          cmake --build build --config Release --parallel

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroneCam-ASI
          path: build/Release/*.asi
