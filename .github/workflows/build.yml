name: Build DroneCam ASI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSVC & Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Setup Premake & Build Plugin-SDK
        run: |
          curl -L -o premake.zip https://github.com/premake/premake-core/releases/download/v5.0.0-beta2/premake-5.0.0-beta2-windows.zip
          tar -xf premake.zip
          git clone --depth 1 https://github.com/DK22Pac/plugin-sdk.git plugin-sdk
          cd plugin-sdk
          ..\premake5.exe vs2022
          msbuild plugin-sdk.sln /t:plugin_sa /p:Configuration=Release /p:Platform=Win32 /m

      - name: Configure CMake
        run: |
          cmake -B build -S . -A Win32 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --config Release --parallel

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroneCam-ASI
          path: build/Release/*.asi
